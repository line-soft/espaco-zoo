<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>LINE SOFT | Acesso ao Sistema</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            background: #f7f7f7;
            color: #111111;
            font-family: "Inter", Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 410px;
        }

        .card {
            width: 100%;
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 22px;
            padding: 38px 34px 34px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand img {
            display: block;
            width: 190px;
            max-width: 70%;
            height: auto;
            margin: 0 auto;
        }

        .welcome {
            text-align: center;
            margin-bottom: 27px;
        }

        .welcome h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 7px;
        }

        .welcome p {
            font-size: 13px;
            color: #777777;
            line-height: 1.5;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #999999;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #222222;
        }

        .field input {
            width: 100%;
            height: 49px;
            border: 1px solid #dddddd;
            border-radius: 10px;
            outline: none;
            padding: 0 15px;
            background: #fafafa;
            color: #111111;
            font-size: 14px;
            font-family: inherit;
            transition: 0.2s ease;
        }

        .field input:focus {
            background: #ffffff;
            border-color: #e33a21;
            box-shadow: 0 0 0 3px rgba(227, 58, 33, 0.09);
        }

        .primary-button,
        .contract-button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-button {
            margin-top: 3px;
            background: #111111;
            color: #ffffff;
        }

        .primary-button:hover {
            background: #252525;
            transform: translateY(-1px);
        }

        .primary-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 13px;
            margin: 28px 0;
            color: #b0b0b0;
            font-size: 11px;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e9e9e9;
        }

        .contract-section {
            padding-top: 1px;
        }

        .contract-button {
            background: #e33a21;
            color: #ffffff;
        }

        .contract-button:hover {
            background: #c92f19;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #aaaaaa;
        }

        .footer strong {
            color: #777777;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 14px;
            }

            .card {
                padding: 32px 22px 27px;
                border-radius: 18px;
            }

            .brand {
                margin-bottom: 27px;
            }

            .brand img {
                width: 165px;
            }

            .welcome h1 {
                font-size: 20px;
            }

            .divider {
                margin: 25px 0;
            }
        }

        @media (max-height: 700px) and (min-width: 481px) {
            body {
                padding: 18px;
            }

            .card {
                padding-top: 27px;
                padding-bottom: 25px;
            }

            .brand {
                margin-bottom: 20px;
            }
        }
        .footer a {
    color: inherit;
    text-decoration: none;
}

.footer a:hover {
    opacity: 0.8;
}
    </style>
</head>

<body>

    <main class="login-container">

        <section class="card">

<div class="brand">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="LINE SOFT">
</div>

            <div class="welcome">
                <h1>Acesso ao Sistema</h1>
                <p>Entre com seus dados para continuar.</p>
            </div>

            <div class="section-title">Área restrita</div>

            <div class="field">
                <label for="login">Login</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Digite seu login"
                    autocomplete="username"
                >
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >
            </div>

            <button
                type="button"
                class="primary-button"
                id="btnLogin"
                onclick="logar()"
            >
                Entrar
            </button>

            <div class="divider">ou</div>

            <div class="contract-section">

                <div class="section-title">Consultar contrato</div>

                <div class="field">
                    <label for="cpf">CPF</label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        inputmode="numeric"
                    >
                </div>

<button
    type="button"
    class="contract-button"
    id="btnBuscarContrato"
    onclick="buscarContrato()"
>
    Buscar contrato
</button>
<div
    id="mensagemContrato"
    style="
        display: none;
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
    "
></div>

            </div>

        </section>

<div class="footer"> <a href="https://wa.me/5521965781487" target="_blank" rel="noopener noreferrer"> DESENVOLVIDO POR &nbsp;•&nbsp; <strong>LINE SOFT</strong> </a> </div>

    </main>


<script>

async function logar() {

    const email =
        document.getElementById("login").value.trim();

    const senha =
        document.getElementById("senha").value;


    if (!email || !senha) {

        alert("Digite o email e a senha.");

        return;
    }


    const botao =
        document.getElementById("btnLogin");


    botao.disabled = true;

    botao.innerText = "Entrando...";


    try {

        const resposta = await fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                senha: senha
            })

        });


        const dados = await resposta.json();


        if (dados.sucesso) {

            /*
             * IMPORTANTE:
             *
             * O Flask decide para onde o usuário deve ir.
             *
             * ADMIN:
             *     /admin
             *
             * SALÃO:
             *     /pagina_inicial
             *
             * Portanto NÃO colocamos /admin fixo aqui.
             */

            window.location.href = dados.redirect;

            return;
        }


        alert(
            dados.mensagem ||
            "Email ou senha inválidos."
        );


    } catch (erro) {

        console.error(erro);

        alert(
            "Não foi possível conectar ao servidor."
        );


    } finally {

        botao.disabled = false;

        botao.innerText = "Entrar";
    }
}


/*
 * Permite apertar ENTER no campo de senha
 * para realizar o login.
 */

document
    .getElementById("senha")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            logar();
        }

    });
async function buscarContrato() {

    const campoCpf =
        document.getElementById("cpf");

    const botao =
        document.getElementById("btnBuscarContrato");

    const mensagem =
        document.getElementById("mensagemContrato");

    const cpfDigitado =
        campoCpf.value.trim();

    mensagem.style.display = "none";
    mensagem.innerText = "";

    const cpfNormalizado =
        cpfDigitado.replace(/\D/g, "");

    if (!cpfNormalizado) {

        mensagem.innerText =
            "Digite o CPF.";

        mensagem.style.display =
            "block";

        return;
    }

    botao.disabled = true;
    botao.innerText = "Buscando...";

    try {

        const resposta = await fetch(
            "/buscar_contrato_cpf?cpf=" +
            encodeURIComponent(cpfNormalizado)
        );

        const dados =
            await resposta.json();

        if (!dados.sucesso) {

            mensagem.innerText =
                dados.mensagem ||
                "CPF não encontrado.";

            mensagem.style.display =
                "block";

            return;
        }

        /*
         * CONTRATO ENCONTRADO
         */

        mensagem.innerText =
            "Contrato encontrado! Abrindo...";

        mensagem.style.display =
            "block";

console.log("RESPOSTA DO SERVIDOR:", dados);
console.log("PDF URL:", dados.pdf_url);

if (dados.pdf_url) {
    window.open(dados.pdf_url, "_blank");
} else {
    mensagem.innerText = "Contrato encontrado, mas o PDF não foi localizado.";
    mensagem.style.display = "block";
}

    } catch (erro) {

        console.error(erro);

        mensagem.innerText =
            "Não foi possível consultar o contrato.";

        mensagem.style.display =
            "block";

    } finally {

        botao.disabled = false;

        botao.innerText =
            "Buscar contrato";
    }
}
</script>

</body>
</html>
